<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rounded HUD Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 
           GEOMETRY CONFIGURATION
        */
        :root {
            /* Distance from screen edge */
            --inset: 10px;

            /* CORNER RADIUS (How round the corners are) */
            --radius: 35px;

            /* Width of side sections before the "bump" starts */
            --tab-spacing: 20%;

            /* Length of the diagonal slope */
            --slope: 70px;
        }

        /* 
           THE OUTER FRAME POLYGON
           Now using multiple points per corner to simulate a curve (Round Corner).
        */
        .hud-outer-curve {
            clip-path: polygon(
                /* --- TOP LEFT CORNER (Rounding) --- */
                var(--inset) calc(var(--inset) + var(--radius)),
                calc(var(--inset) + var(--radius) * 0.15) calc(var(--inset) + var(--radius) * 0.65),
                calc(var(--inset) + var(--radius) * 0.35) calc(var(--inset) + var(--radius) * 0.35),
                calc(var(--inset) + var(--radius) * 0.65) calc(var(--inset) + var(--radius) * 0.15),
                calc(var(--inset) + var(--radius)) var(--inset),

                /* --- TOP EDGE & TAB --- */
                calc(var(--tab-spacing)) var(--inset),
                calc(var(--tab-spacing) + var(--slope)) 60px,
                calc(100% - var(--tab-spacing) - var(--slope)) 60px,
                calc(100% - var(--tab-spacing)) var(--inset),

                /* --- TOP RIGHT CORNER (Rounding) --- */
                calc(100% - var(--inset) - var(--radius)) var(--inset),
                calc(100% - var(--inset) - var(--radius) * 0.65) calc(var(--inset) + var(--radius) * 0.15),
                calc(100% - var(--inset) - var(--radius) * 0.35) calc(var(--inset) + var(--radius) * 0.35),
                calc(100% - var(--inset) - var(--radius) * 0.15) calc(var(--inset) + var(--radius) * 0.65),
                calc(100% - var(--inset)) calc(var(--inset) + var(--radius)),

                /* --- RIGHT EDGE --- */
                calc(100% - var(--inset)) calc(100% - var(--inset) - var(--radius)),
                
                /* --- BOTTOM RIGHT CORNER (Rounding) --- */
                calc(100% - var(--inset) - var(--radius) * 0.15) calc(100% - var(--inset) - var(--radius) * 0.65),
                calc(100% - var(--inset) - var(--radius) * 0.35) calc(100% - var(--inset) - var(--radius) * 0.35),
                calc(100% - var(--inset) - var(--radius) * 0.65) calc(100% - var(--inset) - var(--radius) * 0.15),
                calc(100% - var(--inset) - var(--radius)) calc(100% - var(--inset)),

                /* --- BOTTOM EDGE & TAB --- */
                calc(100% - var(--tab-spacing)) calc(100% - var(--inset)),
                calc(100% - var(--tab-spacing) - var(--slope)) 94%,
                calc(var(--tab-spacing) + var(--slope)) 94%,
                calc(var(--tab-spacing)) calc(100% - var(--inset)),

                /* --- BOTTOM LEFT CORNER (Rounding) --- */
                calc(var(--inset) + var(--radius)) calc(100% - var(--inset)),
                calc(var(--inset) + var(--radius) * 0.65) calc(100% - var(--inset) - var(--radius) * 0.15),
                calc(var(--inset) + var(--radius) * 0.35) calc(100% - var(--inset) - var(--radius) * 0.35),
                calc(var(--inset) + var(--radius) * 0.15) calc(100% - var(--inset) - var(--radius) * 0.65),
                var(--inset) calc(100% - var(--inset) - var(--radius))
            );
        }

        /* INNER BOX */
        .hud-inner {
            clip-path: polygon(
                50px 0%, calc(100% - 50px) 0%, 100% 50px, 100% calc(100% - 50px),
                calc(100% - 50px) 100%, 50px 100%, 0% calc(100% - 50px), 0% 50px
            );
        }
    </style>
</head>

<body class="bg-[#02060f] h-screen w-screen overflow-hidden flex items-center justify-center font-sans selection:bg-cyan-500 selection:text-black">

    <!-- MAIN CONTAINER -->
    <div class="absolute inset-0 w-full h-full z-10">
        <!-- 1. Glow Effect -->
        <div class="absolute inset-0 bg-cyan-500/20 blur-lg hud-outer-curve pointer-events-none"></div>
        <!-- 2. The Border Color -->
        <div class="absolute inset-0 bg-[#06b6d4] hud-outer-curve pointer-events-none"></div>
        <!-- 3. The Mask (Background) -->
        <div class="absolute inset-[2px] bg-[#02060f] hud-outer-curve pointer-events-none"></div>
    </div>

    <!-- INNER FRAME -->
    <div class="relative w-[80%] h-[70%] z-20 flex items-center justify-center">
        <div class="absolute inset-0 bg-[#0891b2] hud-inner opacity-80"></div>
        <div class="absolute inset-[1px] bg-[#02060f] hud-inner flex items-center justify-center">
            <div class="text-center">
                <p class="text-slate-400 text-xs md:text-sm uppercase tracking-[0.2em] mb-2 opacity-70">Status: Online</p>
                <p class="text-cyan-100 text-sm md:text-lg tracking-wide">
                    ROUNDED HUD SYSTEM
                </p>
            </div>
        </div>
    </div>

</body>
</html>
